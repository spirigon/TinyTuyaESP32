name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Host tests
        run: python tests/run_host_tests.py
      - name: ESP32 build matrix
        run: >
          python -m platformio run
          -e discovery
          -e poll_status
          -e push_updates
          -e http_forward
          -e http_forward_multi
          -e validate_device
          -e async_fsm
          -e async_task
          -e multi_device
          -e control_relay
          -e verify_relay
          -e board_smoke
